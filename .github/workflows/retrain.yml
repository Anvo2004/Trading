# Train lại phương pháp vàng mỗi tuần trên máy chủ GitHub (thay cho Task Scheduler trên máy cá nhân):
# tải tick Exness mới nhất → opt.py (24.300 tổ hợp, walk-forward) → mtf.py (H4/H1/M15/M5) → refine.py (entry M5/M15) → cập nhật trang Báo cáo.
name: Train lai hang tuan
on:
  schedule:
    - cron: '0 2 * * 0'       # Chủ nhật 09:00 giờ VN
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: retrain
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas
      - uses: actions/cache@v4
        with:
          path: Data/_XAUUSDm_parts
          key: parts-XAUUSDm-${{ github.run_id }}
          restore-keys: parts-XAUUSDm-
      - name: Train lại + đẩy kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python BacktestLab/backtest/update.py --push
      - name: Nhật ký
        if: always()
        run: tail -n 40 Data/update.log || true
      - name: Build lại web
        continue-on-error: true
        run: curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds
